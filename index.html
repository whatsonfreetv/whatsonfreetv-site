<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsOnFreeTV — Free Streaming TV Channels</title>
  <meta name="description" content="Discover hundreds of free streaming TV channels available in the US and Canada.">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Inline only what this page needs */
  </style>
</head>
<body>
  <div class="redirect-page">
    <div class="redirect-logo">WhatsOn<span>FreeTV</span></div>
    <div class="redirect-spinner" id="spinner"></div>
    <p class="redirect-msg" id="redirectMsg">Detecting your location…</p>

    <!-- Shown only if geo-detection fails or takes too long -->
    <div class="redirect-manual hidden" id="manualLinks">
      <a href="us.html" class="redirect-btn">🇺🇸 United States</a>
      <a href="ca.html" class="redirect-btn">🇨🇦 Canada</a>
    </div>
  </div>

  <!-- ======================== FOOTER ======================== -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-logo">WhatsOn<span>FreeTV</span></div>
      <nav class="footer-links">
        <a href="us.html" class="footer-link">🇺🇸 US Channels</a>
        <a href="ca.html" class="footer-link">🇨🇦 CA Channels</a>
        <a href="suggest.html" class="footer-link">Suggest a Channel</a>
        <a href="privacy.html" class="footer-link">Privacy Policy</a>
        <a href="terms.html" class="footer-link">Terms of Service</a>
        <a href="mailto:hello@whatsonfreetv.com" class="footer-link">Contact</a>
      </nav>
      <div class="footer-legal">
        <p class="footer-copy">&copy; 2026 WhatsOnFreeTV. All rights reserved.</p>
        <div class="footer-attribution">
          <a href="https://www.tvmaze.com" target="_blank" rel="noopener" class="footer-attr-link">Show data from TVmaze</a>
          <span class="footer-sep">&middot;</span>
          <a href="https://www.omdbapi.com" target="_blank" rel="noopener" class="footer-attr-link">Movie data from OMDb</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      const TIMEOUT_MS = 4000;
      let redirected = false;

      function go(country, save) {
        if (redirected) return;
        redirected = true;
        const code = country === 'CA' ? 'CA' : 'US';
        if (save) {
          try { localStorage.setItem('country', code); } catch (e) {}
        }
        const dest = code === 'CA' ? 'ca.html' : 'us.html';
        window.location.replace(dest);
      }

      // Use cached country if available — skip geo-detection entirely
      try {
        const cached = localStorage.getItem('country');
        if (cached === 'US' || cached === 'CA') {
          go(cached, false);
          return;
        }
      } catch (e) {}

      // Show manual links as fallback after timeout
      const fallbackTimer = setTimeout(() => {
        if (!redirected) {
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('redirectMsg').textContent = 'Choose your country:';
          document.getElementById('manualLinks').classList.remove('hidden');
        }
      }, TIMEOUT_MS);

      // Primary: ipapi.co (returns country code as plain text)
      fetch('https://ipapi.co/country/', { signal: AbortSignal.timeout(3000) })
        .then(r => r.text())
        .then(code => {
          clearTimeout(fallbackTimer);
          go(code.trim().toUpperCase(), true);
        })
        .catch(() => {
          // Fallback: ip-api.com
          fetch('https://ip-api.com/json/?fields=countryCode', { signal: AbortSignal.timeout(3000) })
            .then(r => r.json())
            .then(d => {
              clearTimeout(fallbackTimer);
              go((d.countryCode || '').toUpperCase(), true);
            })
            .catch(() => {
              // Default to US if both fail
              clearTimeout(fallbackTimer);
              go('US', true);
            });
        });
    })();
  </script>
</body>
</html>
